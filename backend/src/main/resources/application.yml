spring:
  application:
    name: expenseflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenseflow}
    username: ${DB_USERNAME:expenseflow}
    password: ${DB_PASSWORD:expenseflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:*}
