<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
      <!-- Logo -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="h-10 w-10 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-md">EF</div>
        <div>
          <p class="text-lg font-semibold text-slate-900">ExpenseFlow</p>
          <p class="text-xs text-slate-400">Track, approve, reimburse</p>
        </div>
      </div>

      <!-- Navigation & Role Control -->
      <div class="flex items-center gap-3 flex-wrap" *ngIf="role$ | async as role; else roleChooser">
        <nav class="hidden lg:flex gap-1 bg-slate-50 p-1 rounded-lg">
          <button type="button"
            *ngFor="let r of roles"
            class="px-3 py-1.5 rounded-md text-sm font-medium transition-all duration-200"
            [ngClass]="r === role ? 'bg-blue-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-white'"
            (click)="selectRole(r)">
            {{ labels[r] }}
          </button>
        </nav>
        <span class="text-sm text-slate-500 hidden sm:inline">Active role: <span class="font-semibold text-slate-900">{{ labels[role] }}</span></span>
        <button class="btn-secondary text-sm px-3 py-1.5 whitespace-nowrap" type="button" (click)="openRoleSelector()">Change Role</button>
      </div>
      <ng-template #roleChooser>
        <a routerLink="/role" class="btn-primary text-sm px-4 py-2 whitespace-nowrap">Choose Role</a>
      </ng-template>
    </div>
  </header>

  <!-- Notification Banner -->
  <ng-container *ngIf="message$ | async as message">
    <div [ngClass]="message.type === 'success' 
      ? 'bg-emerald-50 border-emerald-200 text-emerald-800' 
      : 'bg-rose-50 border-rose-200 text-rose-800'"
         class="border-b text-sm py-3 px-4 text-center font-medium animate-slide-down">
      {{ message.text }}
    </div>
  </ng-container>

  <!-- Main Content -->
  <main class="flex-1 w-full">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-100 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 text-center text-xs text-slate-500">
      <p>&copy; 2024 ExpenseFlow. All rights reserved.</p>
    </div>
  </footer>
</div>
