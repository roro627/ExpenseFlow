<div class="grid md:grid-cols-3 gap-4">
  <div *ngFor="let role of roles" class="card p-6 flex flex-col gap-4">
    <div>
      <p class="text-sm uppercase tracking-wide text-slate-400">{{ role.helper }}</p>
      <h2 class="text-xl font-semibold text-slate-900">{{ labels[role.key] }}</h2>
      <p class="text-slate-600 mt-2">{{ role.description }}</p>
    </div>
    <button class="btn-primary" type="button" (click)="choose(role.key)">Continue as {{ labels[role.key] }}</button>
  </div>
</div>
