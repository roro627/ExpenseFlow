services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: expenseflow
      POSTGRES_USER: expenseflow
      POSTGRES_PASSWORD: expenseflow
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenseflow
      DB_USERNAME: expenseflow
      DB_PASSWORD: expenseflow
      UPLOAD_DIR: /data/uploads
      ALLOWED_ORIGINS: "*"
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db-data:
  uploads:
